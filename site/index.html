// ---- fins: passive rays bending in water (display) -------------------------------------------------
// Fin rays are segmented flexible beams — stiff at the base, softer toward the tip — and most of a
// fin's flowing look is PASSIVE: water pushing on the ray as it moves. Per ray-bone: tip velocity
// through still water → drag (linear viscous + quadratic pressure) perpendicular to the ray → torque

// debug probe (?debug=1): where the head points vs where the fish moves — 3D and on screen
if (Q.get("debug") === "1") window.__bones = () => bones.map(b => [b.name.replace('_Armature',''), +(b.userData.tw || 0).toFixed(2), b.children.some(c => c.isBone) ? '' : 'leaf']);

  if (bones.length < 3) return null;

// fullscreen + idle cursor (display mode). Fullscreen needs a user gesture, so: click / F / dblclick.
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else { const el = document.documentElement; const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => {}); }
}
if (DISPLAY) {
  cv.addEventListener("click", () => { if (!isFull()) toggleFull(); });
  addEventListener("keydown", e => { if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey) toggleFull(); });
  // scroll wheel = zoom = fish size (0.5×–3.5×); the camera and the tank never move
  addEventListener("wheel", e => { e.preventDefault(); zoomTo = clamp(zoomTo * Math.exp(-e.deltaY * 0.0012), 0.5, 3.5); zoomT = performance.now() / 1000; }, { passive: false });
  scene.add(ghost);
  const toSettings = () => {
    const u = new URLSearchParams({ display: "0", m: MODEL, rx: CORR.x, ry: CORR.y, rz: CORR.z, amp: AMP, ax: AX, clip: CLIP ? 1 : 0, proc: PROC ? 1 : 0 });
    if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    location.href = location.pathname + "?" + u;
  };
  document.getElementById("back").addEventListener("click", e => { e.stopPropagation(); toSettings(); });

function loop() {

    for (let i = 0; i < bones.length; i++) { const tw = bones[i].userData.tw || 0, a = (Math.sin(ph - tw * 5) * AMP + bank) * tw * tw; if (AX === "x") bones[i].rotateX(a); else if (AX === "y") bones[i].rotateY(a); else bones[i].rotateZ(a); }
  }

  renderer.render(scene, cam);
  info.textContent = `${MODEL}  ·  rot X:${CORR.x}° Y:${CORR.y}° Z:${CORR.z}°  ·  bend ${AX} amp ${AMP}  ·  swim ${SWIM ? "on (red arrow = direction)" : "off"}`;

}
